name: Lint

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Oldest supported version (see SETUP.md), so newer-only syntax is caught.
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint -r requirements.txt

      - name: Check syntax of every Python file
        run: python -m compileall -q .

      - name: Check every day has a solution
        run: python check.py

      - name: Get changed Python files
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          # New branches have no "before" commit; fall back to the whole history.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          git diff --name-only --diff-filter=d "$base" HEAD -- '*.py' > changed_py.txt
          cat changed_py.txt

      # Legacy years predate the current style rules, so only years that ship
      # their own .pylintrc (2025+) and the root scripts are linted strictly.
      - name: Pylint changed files
        run: |
          status=0
          while read -r file; do
            dir=${file%%/*}
            if [ "$dir" = "$file" ]; then
              rc=.pylintrc
            elif [ -f "$dir/.pylintrc" ]; then
              rc="$dir/.pylintrc"
            else
              continue
            fi
            echo "::group::pylint $file ($rc)"
            pylint --rcfile="$rc" "$file" || status=1
            echo "::endgroup::"
          done < changed_py.txt
          exit $status

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed Cargo workspaces
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          dirs=$(git diff --name-only --diff-filter=d "$base" HEAD -- '*.rs' '*Cargo.toml' \
            | cut -d/ -f1 | sort -u \
            | while read -r d; do if [ -f "$d/Cargo.toml" ]; then echo "$d"; fi; done \
            | tr '\n' ' ')
          echo "Changed workspaces: $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.changed.outputs.dirs != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        if: steps.changed.outputs.dirs != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            2021
            2022
            2023
            2024
            2025

      # Inputs are not committed, but older years embed them with include_str!,
      # so create empty placeholders next to every Rust source to let them compile.
      - name: Create placeholder inputs
        if: steps.changed.outputs.dirs != ''
        env:
          DIRS: ${{ steps.changed.outputs.dirs }}
        run: |
          for dir in $DIRS; do
            find "$dir" -name '*.rs' -not -path '*/target/*' -printf '%h\n' | sort -u \
              | while read -r d; do touch "$d/input.txt"; done
          done

      # Legacy years predate the current style rules, so they only have to
      # compile; 2025+ must be clippy-clean.
      - name: Lint Rust code
        if: steps.changed.outputs.dirs != ''
        env:
          DIRS: ${{ steps.changed.outputs.dirs }}
        run: |
          status=0
          for dir in $DIRS; do
            if [ "$dir" -ge 2025 ]; then
              echo "::group::clippy $dir"
              (cd "$dir" && cargo clippy --workspace --all-targets -- -D warnings) || status=1
            else
              echo "::group::check $dir"
              (cd "$dir" && cargo check --workspace --all-targets) || status=1
            fi
            echo "::endgroup::"
          done
          exit $status
